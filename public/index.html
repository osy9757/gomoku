<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오목 · 온라인 2인용 대국</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 테마 토글 (우상단) -->
  <button id="themeToggle" class="theme-toggle" type="button">🎨 테마: 기본</button>

  <!-- 엑셀 테마 상단 크롬 (기본 테마에서는 숨김) -->
  <div class="excel-chrome" id="excelChrome" aria-hidden="true">
    <div class="excel-titlebar">
      <span class="excel-title">통합 문서1 - Excel</span>
      <span class="excel-winbtns">
        <span class="win-dot min"></span>
        <span class="win-dot max"></span>
        <span class="win-dot close"></span>
      </span>
    </div>
    <div class="excel-ribbon">
      <span class="ribbon-tab">파일</span>
      <span class="ribbon-tab active">홈</span>
      <span class="ribbon-tab">삽입</span>
      <span class="ribbon-tab">페이지 레이아웃</span>
      <span class="ribbon-tab">수식</span>
      <span class="ribbon-tab">데이터</span>
      <span class="ribbon-tab">검토</span>
      <span class="ribbon-tab">보기</span>
    </div>
    <div class="excel-formula">
      <span class="name-box" id="excelNameBox">A1</span>
      <span class="fx-label">fx</span>
      <span class="fx-input" id="excelFormula"></span>
    </div>
  </div>

  <div class="page">
    <header class="site-header">
      <h1 class="site-title">오목</h1>
      <p class="site-subtitle">온라인 2인용 대국</p>
    </header>

    <main class="layout">
      <!-- 왼쪽 패널 -->
      <aside class="panel left-panel">
        <!-- 모드 탭 -->
        <div class="card mode-card">
          <div class="mode-tabs">
            <button class="mode-tab active" data-mode="local" type="button">로컬 2인</button>
            <button class="mode-tab" data-mode="online" type="button">온라인 대전</button>
          </div>

          <!-- 규칙 선택 -->
          <div class="rule-select">
            <span class="rule-label">규칙</span>
            <div class="rule-options">
              <label class="rule-opt"><input type="radio" name="rule" value="renju" checked /> 렌주룰</label>
              <label class="rule-opt"><input type="radio" name="rule" value="free" /> 자유룰</label>
            </div>
          </div>

          <!-- 온라인 로비 (온라인 모드에서만 표시) -->
          <div class="online-lobby" id="onlineLobby" hidden>
            <!-- 내 돌 색 선택 (방 만들기 전) -->
            <div class="rule-select color-select">
              <span class="rule-label">내 돌</span>
              <div class="rule-options">
                <label class="rule-opt"><input type="radio" name="myColor" value="black" checked /> 흑돌</label>
                <label class="rule-opt"><input type="radio" name="myColor" value="white" /> 백돌</label>
                <label class="rule-opt"><input type="radio" name="myColor" value="random" /> 랜덤</label>
              </div>
            </div>
            <div class="lobby-actions">
              <button class="btn btn-green" id="btnCreateRoom" type="button">방 만들기</button>
              <div class="join-row">
                <input type="text" id="joinCodeInput" maxlength="6" placeholder="코드 입력" />
                <button class="btn btn-gray" id="btnJoinRoom" type="button">참가</button>
              </div>
            </div>
            <div class="room-info" id="roomInfo" hidden>
              <div class="room-code-row">
                <span class="room-code-label">방 코드</span>
                <span class="room-code" id="roomCodeText">------</span>
                <button class="btn btn-mini" id="btnCopyCode" type="button">복사</button>
              </div>
              <p class="room-status" id="roomStatusText">상대를 기다리는 중...</p>
              <button class="btn btn-gray btn-swap" id="btnSwap" type="button" style="display:none">돌 바꾸기</button>
            </div>
          </div>
        </div>

        <!-- 플레이어 정보 -->
        <div class="card">
          <h2 class="card-title"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="6" r="2.5"/><path d="M2.5 16c0-3 2-4.5 4.5-4.5s4.5 1.5 4.5 4.5"/><circle cx="14.2" cy="7.2" r="2"/><path d="M11.6 16c.3-2.2 1.7-3.5 3.5-3.5s3.2 1.3 3.5 3.5"/></svg>플레이어 정보</h2>
          <div class="player-card" id="playerBlack">
            <span class="stone-icon black"></span>
            <div class="player-meta">
              <span class="player-name">흑돌 <span class="player-tag" id="tagBlack"></span></span>
              <span class="player-status" id="statusBlack">대기 중</span>
            </div>
            <span class="player-timer" id="timerBlack">00:00</span>
          </div>
          <div class="player-card" id="playerWhite">
            <span class="stone-icon white"></span>
            <div class="player-meta">
              <span class="player-name">백돌 <span class="player-tag" id="tagWhite"></span></span>
              <span class="player-status" id="statusWhite">대기 중</span>
            </div>
            <span class="player-timer" id="timerWhite">00:00</span>
          </div>
        </div>

        <!-- 게임 정보 -->
        <div class="card">
          <h2 class="card-title"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><line x1="10" y1="9" x2="10" y2="14"/><circle cx="10" cy="6.2" r="0.9" fill="currentColor" stroke="none"/></svg>게임 정보</h2>
          <div class="info-row">
            <span class="info-label">현재 차례</span>
            <span class="info-value"><span class="stone-icon small black" id="turnStone"></span><span id="turnText">흑돌</span></span>
          </div>
          <div class="info-row">
            <span class="info-label">게임 상태</span>
            <span class="info-value" id="gameStateText">진행 중</span>
          </div>
          <div class="btn-group">
            <button class="btn btn-green" id="btnNewGame" type="button"><svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M5 3.5v13l11-6.5-11-6.5z"/></svg>새 게임 시작</button>
            <button class="btn btn-accent" id="btnUndo" type="button"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 8.5h8a4.5 4.5 0 0 1 0 9H8.5"/><polyline points="7 5 4 8.5 7 12"/></svg>무르기</button>
            <button class="btn btn-gray" id="btnReset" type="button"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 10a6 6 0 0 1 10.2-4.2M16 10a6 6 0 0 1-10.2 4.2"/><polyline points="14.5 3.2 14.2 6 11.5 5.7"/><polyline points="5.5 16.8 5.8 14 8.5 14.3"/></svg>게임 재설정</button>
          </div>
        </div>
      </aside>

      <!-- 가운데 보드 -->
      <section class="board-area">
        <div class="board-flip" id="boardFlip">
          <div class="board" id="board">
            <div class="board-inner" id="boardInner">
              <canvas class="board-lines" id="boardCanvas"></canvas>
              <div class="excel-headers" id="excelHeaders"></div>
              <div class="board-cells" id="boardCells"></div>
              <div class="stones-layer" id="stonesLayer"></div>
              <div class="markers-layer" id="markersLayer"></div>
              <div class="click-overlay" id="clickOverlay"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 오른쪽 패널 -->
      <aside class="panel right-panel">
        <div class="card record-card">
          <h2 class="card-title"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10.5" r="6.8"/><polyline points="10 6.8 10 10.5 12.8 12"/><polyline points="8.6 3 10 3 10 4.4"/></svg>기보</h2>
          <div class="move-list" id="moveList">
            <p class="move-empty" id="moveEmpty">게임이 아직 시작되지 않았습니다</p>
          </div>
        </div>

        <!-- 채팅 (온라인 모드에서만) -->
        <div class="card chat-card" id="chatCard" hidden>
          <h2 class="card-title"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4.5h14a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H8l-4 3v-3H3a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1z"/></svg>채팅</h2>
          <div class="chat-list" id="chatList"></div>
          <div class="chat-input-row">
            <input type="text" id="chatInput" maxlength="500" placeholder="메시지 입력..." />
            <button class="btn btn-green btn-mini" id="btnSendChat" type="button">전송</button>
          </div>
        </div>

        <!-- 언어 선택 (로컬/온라인 모드 공통) -->
        <div class="card lang-card">
          <h2 class="card-title"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><ellipse cx="10" cy="10" rx="3.2" ry="7.5"/><line x1="2.5" y1="10" x2="17.5" y2="10"/></svg>언어</h2>
          <details class="lang-select" id="langSelect">
            <summary class="lang-summary">
              <span>한국어</span>
              <svg class="lang-chevron" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><polyline points="5 7.5 10 12.5 15 7.5"/></svg>
            </summary>
            <ul class="lang-options">
              <li class="lang-option selected" id="langOptionKo">한국어</li>
            </ul>
          </details>
        </div>
      </aside>
    </main>

    <footer class="site-footer">
      <p id="footerText"></p>
    </footer>
  </div>

  <!-- 엑셀 하단 시트 탭 / 상태바 -->
  <div class="excel-bottom" id="excelBottom" aria-hidden="true">
    <div class="sheet-tabs">
      <span class="sheet-tab active">Sheet1</span>
      <span class="sheet-tab">대국기록</span>
      <span class="sheet-tab">채팅+</span>
    </div>
    <div class="status-bar">
      <span class="status-left">준비</span>
      <span class="status-right">합계: 0&nbsp;&nbsp;평균: 0&nbsp;&nbsp;개수: 0&nbsp;&nbsp;&nbsp;&nbsp;100%</span>
    </div>
  </div>

  <!-- 결과 모달 -->
  <div class="modal-backdrop" id="resultModal" hidden>
    <div class="modal-card">
      <span class="modal-stone" id="modalStone"></span>
      <h2 class="modal-title" id="modalTitle">흑돌 승리!</h2>
      <p class="modal-message" id="modalMessage"></p>
      <button class="btn btn-green" id="btnPlayAgain" type="button"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 4h8v4a4 4 0 0 1-8 0V4z"/><path d="M6 5H3.5A2.5 2.5 0 0 0 6 8"/><path d="M14 5h2.5A2.5 2.5 0 0 1 14 8"/><line x1="10" y1="12" x2="10" y2="15"/><line x1="7" y1="16.5" x2="13" y2="16.5"/></svg>다시 하기</button>
    </div>
  </div>

  <!-- 토스트 -->
  <div class="toast" id="toast" hidden></div>

  <script src="rules.js"></script>
  <script src="game.js"></script>
</body>
</html>
